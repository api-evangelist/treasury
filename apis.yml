name: Treasury
description: >-
  Treasury (treasury.app) is a consumer investing and personal-finance education
  platform that bills itself as "the first investing platform built for learning
  as a community" and a "non-judgmental investing community." It pairs
  creator-led learning communities (workshops, coaching, and discussion forums),
  commission-free brokerage investing accounts with fractional and recurring
  investments, and self-guided courses on investing, personal finance, and
  retirement. Backed by Bloomberg Beta and other investors, Treasury has
  introduced tens of thousands of new investors to the market. It has no
  traditional public REST/OpenAPI developer platform, but it does expose an
  agent-native surface: a hosted Model Context Protocol (MCP) server at
  treasury.app/mcp guarded by an OAuth 2.1 authorization server (authorization
  code + PKCE, dynamic client registration, scope mcp:connect).
